# Actualizaciones automáticas: Dependabot abre un pull request y el workflow lo verifica antes de integrarlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Parches y menores en un solo PR; las versiones mayores llegan por separado para revisarlas con calma.
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: ci
